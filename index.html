<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paulinho Serviços Gerais – obras e orçamento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eeeae2;--surface:#fffdf8;--ink:#23272b;--muted:#636970;--line:#c9c2b7;--map:#dfe8dc;--blob:#c9d8c3;--accent:#23272b;--accent-ink:#fffdf8;--wa:#17894b;--pin:#d23b2d;--yellow:#f2d216;--road:#fff9e8;--river:#8eb7c6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191b;--surface:#212528;--ink:#ecebe8;--muted:#a3a8ad;--line:#3a3f44;--map:#1f2a22;--blob:#2c3b2f;--accent:#ecebe8;--accent-ink:#17191b}}
:root[data-theme="dark"]{--bg:#17191b;--surface:#212528;--ink:#ecebe8;--muted:#a3a8ad;--line:#3a3f44;--map:#1f2a22;--blob:#2c3b2f;--accent:#ecebe8;--accent-ink:#17191b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 18px 48px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:700}
h2{font-size:1.7rem;margin-bottom:12px}
#logo{width:112px;height:112px;object-fit:cover;border:3px solid var(--yellow);border-radius:18px;display:none;flex:none;box-shadow:0 12px 30px #0006}
.hero{position:relative;overflow:hidden;background:#231f20;color:#f4f1ea;margin:-20px -18px 0;padding:34px 22px 28px;border-radius:0 0 24px 24px;box-shadow:0 18px 42px #4d463923}
.hero:after{content:"";position:absolute;right:-85px;top:-110px;width:270px;height:270px;border:46px solid #f2d21612;border-radius:50%;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .top{display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero h1{color:var(--yellow);letter-spacing:-.025em}.hero .sub{color:#e4e0d8;margin-bottom:0;font-size:1.08rem}
.svcs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 20px;padding:0;list-style:none}
.svcs li{border:1.5px solid #f2d216;color:#f2d216;border-radius:99px;padding:4px 12px;font-size:.9rem;font-weight:500;background:#f2d2160d}
.hero .btn:not(.main){border-color:#f2d216;color:#f2d216}
.hero .stats b{color:#fff}.hero .stats span{color:#bdb8ae}
.sub{color:var(--muted);margin:8px 0 20px;max-width:52ch}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 15px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--ink);font:600 1rem Barlow,sans-serif;text-decoration:none;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px #00000018}
.btn.main{background:var(--wa);border-color:var(--wa);color:#fff;grid-column:1/-1;font-size:1.1rem}
.btn:focus-visible,.pin:focus-visible,.chip:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.stats{display:flex;gap:24px;margin:28px 0 8px;flex-wrap:wrap}
.stats b{font:700 2.2rem "Barlow Condensed",sans-serif;display:block;line-height:1}
.stats span{color:var(--muted);font-size:.9rem}
section{margin-top:42px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;font:500 .95rem Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mapbox{position:relative;border:1px solid #aeb8a9;border-radius:18px;overflow:hidden;background:var(--map);box-shadow:0 16px 36px #3c47351f}
.mapbox:after{content:"ILUSTRAÇÃO GEOGRÁFICA APROXIMADA";position:absolute;left:12px;bottom:10px;padding:4px 7px;border-radius:5px;background:#fffdf8d9;color:#4e555b;font:700 9px/1 Barlow,sans-serif;letter-spacing:.08em;pointer-events:none}
svg{display:block;width:100%;height:auto}
.map-land{fill:#dce6d7}.municipio{fill:var(--blob);stroke:#f7f4ea;stroke-width:3;stroke-linejoin:round}.municipio.americana{fill:#b7cdae}.municipio-label{fill:#697269;font:700 11px Barlow,sans-serif;letter-spacing:.06em;text-anchor:middle;paint-order:stroke;stroke:#e4ebdf;stroke-width:4px;transition:opacity .2s ease}.rio{fill:none;stroke:var(--river);stroke-width:7;stroke-linecap:round;opacity:.85}.rio-fino{stroke-width:3;opacity:.7}.estrada{fill:none;stroke:var(--road);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 #8c907c)}.estrada.eixo{stroke:#f3d468;stroke-width:9}.estrada-label{fill:#555b5c;font:700 9px Barlow,sans-serif;paint-order:stroke;stroke:#fffdf8;stroke-width:3px;letter-spacing:.03em;transition:opacity .2s ease}.map-note{fill:#617067;font:600 10px Barlow,sans-serif;letter-spacing:.08em;transition:opacity .2s ease}.detalhe .municipio-label,.detalhe .estrada-label,.detalhe .map-note{opacity:.15}
.lbl{fill:var(--ink);font:700 13px Barlow,sans-serif;paint-order:stroke;stroke:#f7f4ea;stroke-width:4px;text-anchor:middle}
.lbl.dim{fill:var(--muted)}
.pin{cursor:pointer}.pin path{fill:var(--pin);stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 3px 3px #0005)}.pin .dot{fill:#fff}
.pin .bd{fill:var(--accent);stroke:none}.pin .bn{fill:var(--accent-ink);font:700 11px Barlow,sans-serif;text-anchor:middle}
.pin:hover path,.pin.on path{fill:#a5160d}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
#crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;min-height:44px}
#crumb strong{font:700 1.4rem "Barlow Condensed",sans-serif}
#detalhe{margin-top:14px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 28px #332f2710}
.card h3{font-size:1.5rem}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);margin:6px 0 12px;font-size:.95rem}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotos figure{margin:0}.fotos figcaption{font-weight:600;font-size:.9rem;margin-top:4px}
.fotos img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:6px}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;box-shadow:0 12px 34px #332f2710}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
input,select{font:400 1rem Barlow,sans-serif;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
@media (max-width:560px){.hero .top{align-items:flex-start}#logo{width:82px;height:82px}.btns,.row{grid-template-columns:1fr}.hero .btn:not(.main){grid-column:1/-1}.mapbox:after{font-size:7px}}
</style>
</head>
<body>
<main>
<header class="hero">
<div class="top"><div><h1 id="nome"></h1>
<p class="sub" id="slogan"></p></div>
<img id="logo" alt="Logo Paulinho Serviços Gerais"></div>
<ul class="svcs"><li>Pintura</li><li>Manutenção residencial</li><li>Reformas</li><li>Assentamento de piso</li><li>E outros serviços</li></ul>
<div class="btns">
<a class="btn main" id="wa" target="_blank" rel="noopener">Pedir orçamento no WhatsApp</a>
<a class="btn" id="ig" target="_blank" rel="noopener">Instagram</a>
<a class="btn" id="tel">Ligar agora</a>
</div>
<div class="stats"><div><b id="s1"></b><span>obras no mapa</span></div><div><b id="s2"></b><span>m² executados</span></div><div><b id="s3"></b><span>cidades atendidas</span></div></div>
</header>

<section>
<h2>Onde já trabalhamos</h2>
<div class="chips" id="chips"></div>
<div id="crumb"></div>
<div class="mapbox"><svg id="mapa" viewBox="0 0 600 520" role="group" aria-label="Mapa esquemático das obras"></svg></div>
<p class="hint" id="dica"></p>
<div id="detalhe" aria-live="polite"></div>
</section>

<section>
<h2>Peça seu orçamento</h2>
<form id="f">
<label>Seu nome<input id="fn" autocomplete="name" required></label>
<div class="row">
<label>Serviço<select id="ft"><option>Assentamento de piso</option><option>Pintura</option><option>Reformas</option><option>Manutenção residencial</option><option>Outro</option></select></label>
<label>Cidade<select id="fc"></select></label>
</div>
<label>Metragem aproximada (m²)<input id="fm" inputmode="numeric" placeholder="Se não souber, deixe em branco"></label>
<button class="btn main" type="submit">Enviar pelo WhatsApp</button>
</form>
</section>
<footer id="foot"></footer>
</main>

const admin=document.createElement('section');admin.className='admin-area';
admin.innerHTML=`<button class="btn" id="admin-open">Área administrativa</button><div id="admin-content" hidden><h2>Administração local</h2><p class="admin-note">Acesso restrito. Entre com o e-mail e a senha do administrador. As obras cadastradas e as fotos ficam salvas no Supabase e aparecem para todos os visitantes do site.</p><form id="admin-login"><label>E-mail<input id="admin-user" type="email" autocomplete="username" required></label><label>Senha<input id="admin-pass" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Entrar</button><p id="login-msg" role="status"></p></form><div id="admin-panel" hidden><button class="btn" id="admin-out">Sair</button><h3>Cadastrar obra</h3><p>Clique no mapa acima para escolher a posição. Depois preencha os dados.</p><form id="obra-form"><label>Título<input id="obra-title" maxlength="160" required></label><div class="row"><label>Cidade<select id="obra-city"></select></label><label>Bairro<input id="obra-area" maxlength="100" required></label></div><div class="row"><label>Latitude<input id="obra-lat" type="number" step="any" min="-90" max="90" required></label><label>Longitude<input id="obra-lng" type="number" step="any" min="-180" max="180" required></label></div><label>Descrição<input id="obra-desc" maxlength="500"></label><div class="row"><label>Foto do antes<input id="obra-antes" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Foto do depois<input id="obra-depois" type="file" accept="image/jpeg,image/png,image/webp"></label></div><button class="btn main" type="submit">Salvar obra no mapa</button><p id="save-msg" role="status"></p></form><button class="btn" id="export-obras">Exportar cadastros</button></div></div>`;
document.querySelector('main').appendChild(admin);
$('obra-city').innerHTML=cidades.map(c=>'<option>'+c+'</option>').join('');
const enderecoCampos=document.createElement('div');

let buscaVersao=0,ultimaBusca=0;const cacheEnderecos=new Map();
function limparPosicao(){buscaVersao++;$('obra-lat').value='';$('obra-lng').value='';$('obra-rua').value='';if(chosen){chosen.remove();chosen=null;}$('endereco-msg').textContent='Endereço alterado. Localize novamente ou escolha a posição no mapa.';}

$('buscar-endereco').onclick=async()=>{
 if(!logged)return;
 const cep=$('obra-cep').value.replace(/\D/g,''),numero=$('obra-numero').value.trim(),msg=$('endereco-msg');
 if(cep.length!==8||!numero){msg.textContent='Informe um CEP com 8 dígitos e o número.';return;}
 if(Date.now()-ultimaBusca<1500){msg.textContent='Aguarde um instante antes de buscar novamente.';return;}
 ultimaBusca=Date.now();const versao=++buscaVersao;const botao=$('buscar-endereco');botao.disabled=true;
 $('obra-lat').value='';$('obra-lng').value='';if(chosen){chosen.remove();chosen=null;}
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 msg.textContent='Consultando endereço…';
 try{
  const resposta=await fetch('https://viacep.com.br/ws/'+cep+'/json/',{signal:controller.signal});
  if(!resposta.ok)throw new Error('Não foi possível consultar o CEP.');
  const endereco=await resposta.json();if(versao!==buscaVersao||!logged)return;
  if(endereco.erro)throw new Error('CEP não encontrado.');
  const normalizar=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
  const cidade=cidades.find(c=>normalizar(c)===normalizar(endereco.localidade));
  if(!cidade||endereco.uf!=='SP')throw new Error('Este CEP fica fora das cinco cidades atendidas.');
  $('obra-city').value=cidade;$('obra-area').value=endereco.bairro||'';$('obra-rua').value=endereco.logradouro||'';
  if(!endereco.logradouro)throw new Error('O CEP não identifica uma rua. Escolha a posição no mapa.');
  msg.textContent=endereco.logradouro+', '+numero+' — '+cidade+'. Localizando…';
  const query=new URLSearchParams({format:'jsonv2',street:numero+' '+endereco.logradouro,city:cidade,state:'São Paulo',country:'Brasil',postalcode:cep,countrycodes:'br',addressdetails:'1',limit:'1'});
  const chave=query.toString();let resultados=cacheEnderecos.get(chave);
  if(!resultados){const r=await fetch('https://nominatim.openstreetmap.org/search?'+query,{signal:controller.signal});if(!r.ok)throw new Error('O serviço de localização não respondeu. Escolha a posição no mapa.');resultados=await r.json();cacheEnderecos.set(chave,resultados);}
  if(versao!==buscaVersao||!logged)return;
  const ponto=resultados[0];if(!ponto)throw new Error('Endereço preenchido, mas o número não foi localizado. Clique na posição correta no mapa.');
  const lat=Number(ponto.lat),lng=Number(ponto.lon);if(!Number.isFinite(lat)||!Number.isFinite(lng))throw new Error('Localização inválida.');
  $('obra-lat').value=lat.toFixed(6);$('obra-lng').value=lng.toFixed(6);
  if(map){chosen=L.marker([lat,lng]).addTo(map);map.setView([lat,lng],18);host.scrollIntoView({behavior:'smooth',block:'center'});}
  msg.textContent=(ponto.address?.house_number===numero?'Número localizado.':'Posição aproximada: o número não foi confirmado.')+' Confira no mapa e ajuste com um clique, se necessário.';
 }catch(e){if(versao===buscaVersao)msg.textContent=e.name==='AbortError'?'A busca demorou demais. Tente novamente ou escolha a posição no mapa.':e.message;}
 finally{clearTimeout(timeout);botao.disabled=false;}
};
let logged=false,saved=[];const storageKey='paulinho-obras-v1';

const map=typeof L==='undefined'?null:L.map(host).setView(centros.Americana,11);
let markers,chosen;
if(map){L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_57t7_1_d8b0592fb9c40ab4cbdd1e16',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);markers=L.layerGroup().addTo(map);map.on('click',e=>{if(!logged)return;$('obra-lat').value=e.latlng.lat.toFixed(6);$('obra-lng').value=e.latlng.lng.toFixed(6);if(chosen)chosen.remove();chosen=L.marker(e.latlng).addTo(map);$('save-msg').textContent='Posição selecionada. Preencha os dados e salve.';});}else{host.textContent='Não foi possível carregar o mapa. Verifique sua conexão e recarregue a página.';}
function renderObras(c){atual=c;marcar();if(map){markers.clearLayers();map.setView(centros[c]||centros.Americana,c?13:11);}bairrosLista.replaceChildren();$('detalhe').replaceChildren();$('crumb').textContent=c||'Obras em Americana e região';$('dica').textContent='Marcadores amarelos: obras cadastradas. Os exemplos do arquivo original não possuem endereço confirmado e aparecem somente na lista.';
 saved.filter(o=>!c||o.cidade===c).forEach(o=>{const card=document.createElement('div');const title=document.createElement('strong');title.textContent=o.titulo;card.appendChild(title);const desc=document.createElement('p');desc.textContent=o.bairro+' · '+o.cidade+(o.obs?' — '+o.obs:'');card.appendChild(desc);[['Antes',o.antes],['Depois',o.depois]].forEach(([t,u])=>{if(!u||u.indexOf(SUPABASE_URL+'/storage/')!==0)return;const f=document.createElement('figure');f.style.margin='8px 0';const im=document.createElement('img');im.src=u;im.alt='Foto do '+t.toLowerCase();im.loading='lazy';im.style.cssText='width:100%;max-width:260px;border-radius:6px;display:block';const cp=document.createElement('figcaption');cp.textContent=t;f.append(im,cp);card.appendChild(f);});if(map)L.marker([o.lat,o.lng],{icon:L.divIcon({className:'obra-pin',html:'P',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(markers).bindPopup(card);const item=document.createElement('button');item.className='chip';item.textContent=o.titulo+' · '+o.cidade;item.onclick=()=>{if(map)map.setView([o.lat,o.lng],17);$('detalhe').replaceChildren(card.cloneNode(true));};bairrosLista.appendChild(item);});
 OBRAS.filter(o=>!c||o.cidade===c).forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o.titulo+' · '+o.cidade;b.onclick=()=>bairro(o.cidade,o.bairro);bairrosLista.appendChild(b);});$('s1').textContent=saved.length;$('s1').nextElementSibling.textContent='obras cadastradas';$('s2').parentElement.hidden=true;$('s3').textContent=cidades.length;}
ir=renderObras;voltar=()=>renderObras(null);renderObras(null);
async function carregarObras(){if(!sb)return;const {data,error}=await sb.from('obras').select('*').order('created_at',{ascending:true});if(error){$('dica').textContent='Não foi possível carregar as obras. Recarregue a página.';return;}saved=(data||[]).filter(o=>centros[o.cidade]&&Number.isFinite(o.lat)&&Number.isFinite(o.lng));renderObras(atual);}
carregarObras();
$('admin-open').onclick=()=>{$('admin-content').hidden=!$('admin-content').hidden;};
$('admin-login').onsubmit=async e=>{e.preventDefault();const msg=$('login-msg');if(!sb){msg.textContent='Não foi possível carregar o login. Recarregue a página.';return;}msg.textContent='Entrando…';const {data,error}=await sb.auth.signInWithPassword({email:$('admin-user').value.trim(),password:$('admin-pass').value});if(error||!data.user){msg.textContent='E-mail ou senha incorretos.';return;}if(data.user.app_metadata?.role!=='admin'){await sb.auth.signOut();msg.textContent='Este usuário não tem permissão de administrador.';return;}logged=true;$('admin-login').hidden=true;$('admin-panel').hidden=false;$('admin-pass').value='';msg.textContent='';};
$('admin-out').onclick=async()=>{if(sb)await sb.auth.signOut();logged=false;$('admin-panel').hidden=true;$('admin-login').hidden=false;if(chosen){chosen.remove();chosen=null;}};
async function reduzir(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Use fotos JPG, PNG ou WebP.');const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!blob||blob.size>5242880)throw new Error('Foto muito grande.');return blob;}
async function enviarFoto(file){if(!file)return '';const blob=await reduzir(file);const caminho='obras/'+crypto.randomUUID()+'.jpg';const {error}=await sb.storage.from(BUCKET).upload(caminho,blob,{contentType:'image/jpeg',upsert:false});if(error)throw new Error('Não foi possível enviar a foto. Entre novamente e tente de novo.');return sb.storage.from(BUCKET).getPublicUrl(caminho).data.publicUrl;}
$('obra-form').onsubmit=async e=>{e.preventDefault();if(!logged||!sb)return;const botao=e.submitter;const obra={cep:$('obra-cep').value.replace(/\D/g,'')||null,numero:$('obra-numero').value.trim()||null,rua:$('obra-rua').value||null,titulo:$('obra-title').value.trim(),cidade:$('obra-city').value,bairro:$('obra-area').value.trim(),lat:Number($('obra-lat').value),lng:Number($('obra-lng').value),obs:$('obra-desc').value.trim()||null,antes:null,depois:null};if(!obra.titulo||!obra.bairro)return;if(botao)botao.disabled=true;try{$('save-msg').textContent='Enviando fotos…';obra.antes=(await enviarFoto($('obra-antes').files[0]))||null;obra.depois=(await enviarFoto($('obra-depois').files[0]))||null;$('save-msg').textContent='Salvando obra…';const {data,error}=await sb.from('obras').insert(obra).select().single();if(error)throw new Error('Não foi possível salvar a obra. Entre novamente e tente de novo.');saved.push(data);renderObras(data.cidade);if(chosen){chosen.remove();chosen=null;}$('obra-form').reset();buscaVersao++;$('endereco-msg').textContent='Informe CEP e número para a próxima obra.';$('save-msg').textContent='Obra salva e publicada no mapa para todos os visitantes.';}catch(err){$('save-msg').textContent=err.message||'Não foi possível salvar a obra.';}finally{if(botao)botao.disabled=false;}};
$('export-obras').onclick=()=>{if(!logged)return;const url=URL.createObjectURL(new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='obras-paulinho.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
