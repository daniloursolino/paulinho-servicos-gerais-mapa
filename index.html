<style>
:root{--bg:#eeeae2;--surface:#fffdf8;--ink:#23272b;--muted:#636970;--line:#c9c2b7;--map:#dfe8dc;--blob:#c9d8c3;--accent:#23272b;--accent-ink:#fffdf8;--wa:#17894b;--pin:#d23b2d;--yellow:#f2d216;--road:#fff9e8;--river:#8eb7c6;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}

.hero{position:relative;overflow:hidden;background:#231f20;color:#f4f1ea;margin:-20px -18px 0;padding:34px 22px 28px;border-radius:0 0 24px 24px;box-shadow:0 18px 42px #4d463923}

.hero>*{position:relative;z-index:1}
.hero .top{display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero h1{color:var(--yellow);letter-spacing:-.025em}.hero .sub{color:#e4e0d8;margin-bottom:0;font-size:1.08rem}
.svcs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 20px;padding:0;list-style:none}
.svcs li{border:1.5px solid #f2d216;color:#f2d216;border-radius:99px;padding:4px 12px;font-size:.9rem;font-weight:500;background:#f2d2160d}
.hero .btn:not(.main){border-color:#f2d216;color:#f2d216}
.hero .stats b{color:#fff}.hero .stats span{color:#bdb8ae}
.sub{color:var(--muted);margin:8px 0 20px;max-width:52ch}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 15px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--ink);font:600 1rem Barlow,sans-serif;text-decoration:none;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px #00000018}
.btn.main{background:var(--wa);border-color:var(--wa);color:#fff;grid-column:1/-1;font-size:1.1rem}
.btn:focus-visible,.pin:focus-visible,.chip:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.stats{display:flex;gap:24px;margin:28px 0 8px;flex-wrap:wrap}
.stats b{font:700 2.2rem "Barlow Condensed",sans-serif;display:block;line-height:1}
.stats span{color:var(--muted);font-size:.9rem}
section{margin-top:42px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;font:500 .95rem Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mapbox{position:relative;border:1px solid #aeb8a9;border-radius:18px;overflow:hidden;background:var(--map);box-shadow:0 16px 36px #3c47351f}
.mapbox:after{content:"ILUSTRAÇÃO GEOGRÁFICA APROXIMADA";position:absolute;left:12px;bottom:10px;padding:4px 7px;border-radius:5px;background:#fffdf8d9;color:#4e555b;font:700 9px/1 Barlow,sans-serif;letter-spacing:.08em;pointer-events:none}
svg{display:block;width:100%;height:auto}
.map-land{fill:#dce6d7}.municipio{fill:var(--blob);stroke:#f7f4ea;stroke-width:3;stroke-linejoin:round}.municipio.americana{fill:#b7cdae}.municipio-label{fill:#697269;font:700 11px Barlow,sans-serif;letter-spacing:.06em;text-anchor:middle;paint-order:stroke;stroke:#e4ebdf;stroke-width:4px;transition:opacity .2s ease}.rio{fill:none;stroke:var(--river);stroke-width:7;stroke-linecap:round;opacity:.85}.rio-fino{stroke-width:3;opacity:.7}.estrada{fill:none;stroke:var(--road);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 #8c907c)}.estrada.eixo{stroke:#f3d468;stroke-width:9}.estrada-label{fill:#555b5c;font:700 9px Barlow,sans-serif;paint-order:stroke;stroke:#fffdf8;stroke-width:3px;letter-spacing:.03em;transition:opacity .2s ease}.map-note{fill:#617067;font:600 10px Barlow,sans-serif;letter-spacing:.08em;transition:opacity .2s ease}.detalhe .municipio-label,.detalhe .estrada-label,.detalhe .map-note{opacity:.15}
.lbl{fill:var(--ink);font:700 13px Barlow,sans-serif;paint-order:stroke;stroke:#f7f4ea;stroke-width:4px;text-anchor:middle}
.lbl.dim{fill:var(--muted)}
.pin{cursor:pointer}.pin path{fill:var(--pin);stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 3px 3px #0005)}.pin .dot{fill:#fff}
.pin .bd{fill:var(--accent);stroke:none}.pin .bn{fill:var(--accent-ink);font:700 11px Barlow,sans-serif;text-anchor:middle}
.pin:hover path,.pin.on path{fill:#a5160d}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
#crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;min-height:44px}
#crumb strong{font:700 1.4rem "Barlow Condensed",sans-serif}
#detalhe{margin-top:14px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 28px #332f2710}
.card h3{font-size:1.5rem}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);margin:6px 0 12px;font-size:.95rem}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotos figure{margin:0}.fotos figcaption{font-weight:600;font-size:.9rem;margin-top:4px}
.fotos img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:6px}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;box-shadow:0 12px 34px #332f2710}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
input,select{font:400 1rem Barlow,sans-serif;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
@media (max-width:560px){.hero .top{align-items:flex-start}#logo{width:82px;height:82px}.btns,.row{grid-template-columns:1fr}.hero .btn:not(.main){grid-column:1/-1}.mapbox:after{font-size:7px}}
</style>
</head>
<body>
<main>
<header class="hero">
<div class="top"><div><h1 id="nome"></h1>
<p class="sub" id="slogan"></p></div>
<img id="logo" alt="Logo Paulinho Serviços Gerais" width="250" height="278"></div>
<ul class="svcs"><li>Pintura</li><li>Manutenção residencial</li><li>Reformas</li><li>Assentamento de piso</li><li>E outros serviços</li></ul>
<div class="btns">
<a class="btn main" id="wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 0 0-8.1 14.4L2.5 21.5l4.7-1.3A9.5 9.5 0 1 0 12 2.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.7 7.8c.3-.4.8-.3 1 .1l.7 1.6c.1.3 0 .6-.2.8l-.5.6c.6 1.2 1.6 2.2 2.9 2.9l.6-.6c.2-.2.5-.3.8-.2l1.6.8c.4.2.5.7.1 1.1-.7.9-1.7 1.2-2.8.8-2.6-.9-4.5-2.8-5.4-5.3-.3-1 0-1.5.2-1.8z" fill="currentColor"/></svg><span>WhatsApp <strong id="wa-num"></strong></span></a>
<a class="btn" id="ig" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.2" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg><span id="ig-nome"></span></a>
</div>
<div class="stats"><div><b id="s1">+30</b><span>obras realizadas</span></div><div><b id="s2">+460</b><span>m² executados</span></div><div><b id="s3">0</b><span>cidades atendidas</span></div></div>
</header>

<section>
<h2>Onde já trabalhamos</h2>
<div class="chips" id="chips"></div>
<div id="crumb"></div>
<div class="mapbox"><svg id="mapa" viewBox="0 0 600 520" role="group" aria-label="Mapa esquemático das obras"></svg></div>
<p class="hint" id="dica"></p>
<div id="detalhe" aria-live="polite"></div>
</section>

<section>
<h2>Peça seu orçamento</h2>
<form id="f">
<label>Seu nome<input id="fn" autocomplete="name" required></label>
<div class="row">
<label>Serviço<select id="ft"><option>Assentamento de piso</option><option>Pintura</option><option>Reformas</option><option>Manutenção residencial</option><option>Outro</option></select></label>
<label>Cidade<select id="fc"></select></label>
</div>
<label>Metragem aproximada (m²)<input id="fm" inputmode="numeric" placeholder="Se não souber, deixe em branco"></label>
<button class="btn main" type="submit">Enviar pelo WhatsApp</button>
</form>
</section>
<footer id="foot"></footer>
</main>
